<section>
            <h2>Cadastro de Voluntários</h2>
            <p>Preencha o formulário abaixo para fazer parte da Patas & Pontes e contribuir com nossas ações de resgate, cuidado e adoção responsável de animais.</p>
        </section>
        <div><h3>Formulário de Inscrição</h3></div>
        
        <form action="">
        
        <fieldset>
            <legend>
                Dados do voluntário
            </legend>
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" required
        placeholder="Digite seu Nome"
        ><br><br>
        
        <label for="datadenascimento">Data</label>
        <input type="date" id="datadenascimento" name="data de nascimento" required
        ><br><br>

        <label for="cpf">Digite seu cpf</label>
        <input 
        type="text"
        id="cpf"
        name="cpf"
        placeholder="000.000.000-00"
        maxlength="14"
        pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
        title="O CPF deve estar no formato: 000.000.000-00 (com fortmato pontos e traço)"
        required><br><br>

        <label for="telefone">Digite seu telefone</label>
        <input 
        type="text"
        id="telefone"
        name="telefone"
        placeholder="(00) 00000-0000"
        maxlength="15"
        required
        ><br><br>
        
        <label for="cep">Digite seu CEP</label>
        <input 
        type="text"
        id="cep"
        name="CEP"
        placeholder="00000-000"
        maxlength="9"
        required>

        <!--componente de feedback-->

        <div class="alerta">
           Cadastro Realizado Com Sucesso
        </div>
        <div class="toast">
            Novo Voluntário Registrado
        </div>
        <span class="badge">
            Disponível
        </span>

       <br><br><button>
        cadastrar
       </button>
       </fieldset>
       </form>
